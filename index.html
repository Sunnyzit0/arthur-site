<!doctype html>
<html lang="pt-BR" data-theme="ato">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Antes de pintar: aplica o tema salvo e decide se mostra o boot -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var t = localStorage.getItem('ato:theme');
          if (t) d.dataset.theme = t;
        } catch (e) {}
        try {
          var calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!calmo && !navigator.webdriver && !sessionStorage.getItem('ato:booted')) d.classList.add('booting');
        } catch (e) {}
      })();
    </script>
    <title>Arthur da Costa Silva · Desenvolvedor Web em Padre Bernardo, GO</title>
